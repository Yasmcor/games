<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <title>Jogo Quebra-Blocos</title>
  <style>
    * { padding: 0; margin: 0; box-sizing: border-box; }
    body { 
      background: #0d0914; 
      display: flex; 
      justify-content: center; 
      align-items: center; 
      height: 100vh; 
      color: #fff; 
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      overflow: hidden;
    }
    canvas { 
      background: #181124; 
      border: 3px solid #ff2a75; 
      border-radius: 12px;
      box-shadow: 0 0 30px rgba(255, 42, 117, 0.3), 0 0 15px rgba(0, 229, 255, 0.2); 
      outline: none;
    }
  </style>
</head>
<body onload="window.focus()">
  <canvas id="myCanvas" width="500" height="400" tabindex="1"></canvas>
  <script src="game.js"></script>
</body>
</html>
