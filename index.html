<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Hub de Jogos Retrô</title>
  <style>
    body {
      background-color: #1a181e;
      color: white;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      margin: 0;
      font-family: sans-serif;
    }

    .game-menu {
      display: flex;
      gap: 10px;
      margin-bottom: 15px;
      flex-wrap: wrap;
      justify-content: center;
    }

    .game-btn {
      background-color: #2a2630;
      color: #f8c257;
      border: 2px solid #39c2d7;
      padding: 8px 16px;
      border-radius: 8px;
      cursor: pointer;
      font-weight: bold;
      transition: 0.2s;
    }

    .game-btn:hover, .game-btn.active {
      background-color: #39c2d7;
      color: #1a181e;
    }

    canvas {
      background-color: #1a181e;
      border: 2px solid #333;
      box-shadow: 0 0 20px rgba(57, 194, 215, 0.2);
      touch-action: none;
    }

    .game-container {
      display: none;
    }

    .game-container.active {
      display: flex;
      flex-direction: column;
      align-items: center;
    }
  </style>
</head>
<body>

  <div class="game-menu">
    <button class="game-btn active" onclick="switchGame('breakout', this)">Blocos</button>
    <button class="game-btn" onclick="switchGame('pacman', this)">Pac-Man</button>
    <button class="game-btn" onclick="switchGame('minesweeper', this)">Campo Minado (Fase 2)</button>
    <button class="game-btn" onclick="switchGame('sudoku', this)">Sudoku (Fase 3)</button>
    <button class="game-btn" onclick="switchGame('solitaire', this)">Paciência (Fase 4)</button>
  </div>

  <div id="breakout-game" class="game-container active">
    <canvas id="myCanvas" width="480" height="320"></canvas>
  </div>

  <div id="pacman-game" class="game-container">
    <canvas id="pacmanCanvas" width="380" height="420"></canvas>
  </div>

  <div id="minesweeper-game" class="game-container">
    <p>Campo Minado será liberado na Fase 2!</p>
  </div>

  <div id="sudoku-game" class="game-container">
    <p>Sudoku será liberado na Fase 3!</p>
  </div>

  <div id="solitaire-game" class="game-container">
    <p>Paciência será liberada na Fase 4!</p>
  </div>

  <script src="game.js"></script>

  <script>
    function switchGame(gameId, btn) {
      document.querySelectorAll('.game-container').forEach(el => el.classList.remove('active'));
      document.querySelectorAll('.game-btn').forEach(el => el.classList.remove('active'));

      document.getElementById(gameId + '-game').classList.add('active');
      btn.classList.add('active');

      if (gameId === 'pacman') {
        initPacman();
      } else if (gameId === 'breakout') {
        initBreakout();
      }
    }
  </script>
</body>
</html>
